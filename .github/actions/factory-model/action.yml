name: Pinned OpenCode worker
description: Run the model in a separate candidate snapshot, without application dependencies or publishing credentials
inputs:
  model:
    required: true
    description: Provider/model identifier
  api-key:
    required: true
    description: Model credential, scoped only to inference
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '22'
        package-manager-cache: false
    - name: Install and verify the worker before exposing its credential
      shell: bash
      run: |
        test "$(npm view opencode-ai@1.18.30 dist.integrity)" = 'sha512-oLcOLQE4XzDKy6T5L5d1RdVJvXHXwVlD4hRF5V317JbUQorrl2EyDdGZk5kbgv675J9FXp8usg92MZbEWhh6gQ=='
        npm install --global opencode-ai@1.18.30
        test "$(opencode --version)" = '1.18.30'
    - name: Run inference without a shell tool
      shell: bash
      env:
        OPENCODE_API_KEY: ${{ inputs.api-key }}
        OPENCODE_MODEL: ${{ inputs.model }}
        OPENCODE_DISABLE_CLAUDE_CODE: '1'
        OPENCODE_DISABLE_DEFAULT_PLUGINS: '1'
        OPENCODE_DISABLE_EXTERNAL_SKILLS: '1'
        OPENCODE_DISABLE_LSP_DOWNLOAD: '1'
        OPENCODE_DISABLE_PROJECT_CONFIG: '1'
        XDG_CACHE_HOME: ${{ runner.temp }}/opencode/cache
        XDG_CONFIG_HOME: ${{ runner.temp }}/opencode/config
        XDG_DATA_HOME: ${{ runner.temp }}/opencode/data
      run: |
        test -n "$OPENCODE_API_KEY"
        mkdir -p "$XDG_CACHE_HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
        export OPENCODE_CONFIG_CONTENT="$(< "$RUNNER_TEMP/opencode-config.json")"
        bun factory/model.ts
        test -s "$RUNNER_TEMP/worker-result.json"
    - name: Preserve non-sensitive model diagnostics
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: factory-model-diagnostic-${{ github.run_id }}-${{ github.job }}
        path: ${{ runner.temp }}/model-diagnostic.json
        if-no-files-found: warn
        retention-days: 7
