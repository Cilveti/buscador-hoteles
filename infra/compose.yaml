name: buscador-hoteles
services:
  postgres:
    image: postgres:17.11-alpine
    ports:
      - "127.0.0.1:55433:5432"
    environment:
      POSTGRES_USER: hoteles
      POSTGRES_DB: hoteles
      POSTGRES_PASSWORD: ${HOTELES_POSTGRES_PASSWORD:?Ejecuta bun run setup}
    volumes:
      - catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoteles -d hoteles"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  catalog_data:
