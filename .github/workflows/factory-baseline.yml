name: Factory baseline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['factory/**', '.github/workflows/factory-baseline.yml']
permissions:
  contents: read
concurrency:
  group: factory-baseline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Check controller contracts before installing application dependencies
        run: bun test factory
      - name: Restore Bun downloads for this lockfile and Linux runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/factory-bun-cache
          key: factory-bun-1.4.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Run isolated application baseline
        env:
          FACTORY_EVIDENCE_DIR: ${{ runner.temp }}/factory-evidence
          FACTORY_BUN_CACHE: ${{ runner.temp }}/factory-bun-cache
        run: bash factory/ci/run.sh
      - name: Keep check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/factory-evidence
          retention-days: 7
          if-no-files-found: error
