name: CI · aplicación y fábrica
on:
  workflow_dispatch:
    inputs:
      review_run:
        description: Opcional. Revalidar solo el revisor sobre el patch ya verificado de este run; no publica ni cambia tareas.
        required: false
        type: string
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    if: github.event_name != 'workflow_dispatch' || inputs.review_run == ''
    name: Tests, navegador y build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Check controller contracts before installing application dependencies
        run: bun test factory
      - name: Check isolated dependency resolution without a model
        run: bun factory/checks/dependencies.integration.ts
      - name: Restore Bun downloads for this lockfile and Linux runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/factory-bun-cache
          key: factory-bun-1.4.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Run isolated application baseline
        env:
          FACTORY_EVIDENCE_DIR: ${{ runner.temp }}/factory-evidence
          FACTORY_BUN_CACHE: ${{ runner.temp }}/factory-bun-cache
        run: bash factory/ci/run.sh
      - name: Resumen de las comprobaciones
        if: always()
        env:
          FACTORY_EVIDENCE_DIR: ${{ runner.temp }}/factory-evidence
        run: bun factory/ci/summary.ts
      - name: Keep check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/factory-evidence
          retention-days: 7
          if-no-files-found: error
  sonar:
    name: Calidad · Sonar
    needs: baseline
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >-
            -Dproject.settings=factory/sonar-project.properties
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}
            -Dsonar.qualitygate.wait=true
  review-replay:
    name: Revisor · diagnóstico de un patch verificado
    if: github.event_name == 'workflow_dispatch' && inputs.review_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    env:
      WORKER_ROLE: reviewer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Validar operador y ejecución de origen
        id: source
        env:
          SOURCE_RUN: ${{ inputs.review_run }}
          GH_TOKEN: ${{ github.token }}
        run: bun factory/replay.ts admit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-task-${{ steps.source.outputs.run }}
          path: ${{ runner.temp }}/task
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-proposal-${{ steps.source.outputs.run }}
          path: ${{ runner.temp }}/proposal
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-checks-${{ steps.source.outputs.run }}
          path: ${{ runner.temp }}/checks
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
      - name: Comprobar identidad del patch y sus pruebas
        id: prepare
        run: bun factory/replay.ts prepare
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.prepare.outputs.base_sha }}
          path: .factory-base
          persist-credentials: false
      - name: Preparar la revisión del snapshot original
        working-directory: .factory-base
        env:
          PATCH_SHA: ${{ steps.prepare.outputs.patch_sha }}
        run: bun ../factory/worker.ts prepare
      - uses: ./.github/actions/factory-model
        with:
          model: opencode-go/glm-5.3
          api-key: ${{ secrets.OPENCODE_API_KEY }}
      - name: Validar el veredicto
        id: verdict
        env:
          PATCH_SHA: ${{ steps.prepare.outputs.patch_sha }}
        run: bun factory/worker.ts review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: factory-review-replay-${{ github.run_id }}
          path: ${{ runner.temp }}/feedback.json
          if-no-files-found: warn
          retention-days: 7
      - name: Exigir una revisión superada
        if: steps.verdict.outputs.status != 'passed'
        run: exit 1
