name: Factory attempt
on:
  workflow_call:
    inputs:
      base_sha:
        type: string
        required: true
      model:
        type: string
        required: true
      reviewer:
        type: string
        required: true
    secrets:
      OPENCODE_API_KEY:
        required: true
    outputs:
      status:
        value: ${{ jobs.review.outputs.status || jobs.verify.outputs.status || jobs.generate.outputs.status }}
      patch_sha:
        value: ${{ jobs.generate.outputs.patch_sha }}
      feedback_artifact:
        value: ${{ jobs.review.outputs.feedback_artifact || jobs.verify.outputs.feedback_artifact }}
permissions: {}
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      status: ${{ steps.serialize.outputs.status }}
      patch_sha: ${{ steps.serialize.outputs.patch_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.base_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-task-${{ github.run_id }}
          path: ${{ runner.temp }}/task
      - name: Recover the prior immutable proposal and feedback
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun factory/artifacts.ts recover
      - name: Prepare an independent Git snapshot and constrained prompt
        run: bun factory/worker.ts prepare
      - uses: ./.github/actions/factory-model
        with:
          model: ${{ inputs.model }}
          api-key: ${{ secrets.OPENCODE_API_KEY }}
      - name: Validate the external patch policy
        id: serialize
        run: bun factory/worker.ts serialize
      - name: Save original proposal or decision request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-proposal-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/agent.patch
            ${{ runner.temp }}/decision.json
          if-no-files-found: error
          retention-days: 7
  verify:
    needs: generate
    if: needs.generate.outputs.status == 'generated'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      status: ${{ steps.report.outputs.status }}
      feedback_artifact: factory-checks-${{ github.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.base_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-task-${{ github.run_id }}
          path: ${{ runner.temp }}/task
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-proposal-${{ github.run_id }}
          path: ${{ runner.temp }}/proposal
      - name: Apply and validate the original patch
        env:
          PATCH_SHA: ${{ needs.generate.outputs.patch_sha }}
        run: bun factory/worker.ts apply
      - name: Restore downloads for the effective candidate lockfile
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/factory-bun-cache
          key: factory-bun-1.4.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Execute isolated checks, real application and browser
        id: checks
        continue-on-error: true
        env:
          FACTORY_EVIDENCE_DIR: ${{ runner.temp }}/evidence
          FACTORY_BUN_CACHE: ${{ runner.temp }}/factory-bun-cache
        run: bash factory/ci/run.sh
      - name: Record evidence against the exact proposal
        id: report
        env:
          CHECK_RESULT: ${{ steps.checks.outcome }}
          PATCH_SHA: ${{ needs.generate.outputs.patch_sha }}
        run: bun factory/artifacts.ts report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: factory-checks-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7
  review:
    needs: [generate, verify]
    if: needs.verify.outputs.status == 'passed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      status: ${{ steps.review.outputs.status }}
      feedback_artifact: factory-review-${{ github.run_id }}
    env:
      WORKER_ROLE: reviewer
      PATCH_SHA: ${{ needs.generate.outputs.patch_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.base_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-task-${{ github.run_id }}
          path: ${{ runner.temp }}/task
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-proposal-${{ github.run_id }}
          path: ${{ runner.temp }}/proposal
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-checks-${{ github.run_id }}
          path: ${{ runner.temp }}/checks
      - name: Prepare independent review
        run: bun factory/worker.ts prepare
      - uses: ./.github/actions/factory-model
        with:
          model: ${{ inputs.reviewer }}
          api-key: ${{ secrets.OPENCODE_API_KEY }}
      - name: Validate the structured review
        id: review
        run: bun factory/worker.ts review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-review-${{ github.run_id }}
          path: ${{ runner.temp }}/feedback.json
          if-no-files-found: error
          retention-days: 7
