name: Factory Sonar main
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/src/**'
      - 'packages/**'
      - 'factory/sonar-project.properties'
permissions:
  contents: read
concurrency:
  group: factory-sonar-main
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the configured Sonar project
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN"
      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >-
            -Dproject.settings=factory/sonar-project.properties
            -Dsonar.scm.revision=${{ github.sha }}
            -Dsonar.qualitygate.wait=true
