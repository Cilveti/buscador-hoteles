name: Fábrica · desarrollo y verificación
on:
  workflow_call:
    inputs:
      base_sha:
        type: string
        required: true
      worker_sha:
        type: string
        required: true
      model:
        type: string
        required: true
      reviewer:
        type: string
        required: true
    secrets:
      OPENCODE_API_KEY:
        required: true
    outputs:
      status:
        value: ${{ jobs.review.outputs.status || jobs.verify.outputs.status || jobs.generate.outputs.status }}
      patch_sha:
        value: ${{ jobs.generate.outputs.patch_sha }}
      feedback_artifact:
        value: ${{ jobs.review.outputs.feedback_artifact || jobs.verify.outputs.feedback_artifact }}
permissions: {}
jobs:
  generate:
    name: Preparar el cambio
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    outputs:
      status: ${{ steps.proposal.outcome == 'success' && steps.serialize.outputs.status || '' }}
      patch_sha: ${{ steps.proposal.outcome == 'success' && steps.serialize.outputs.patch_sha || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.base_sha }}
          persist-credentials: false
      - name: Cargar la versión registrada del ejecutor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.worker_sha }}
          path: .factory-worker
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-task-${{ github.run_id }}
          path: ${{ runner.temp }}/task
      - name: Recuperar el cambio y los fallos del intento anterior
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun factory/artifacts.ts recover
      - name: Preparar el contexto y los permisos del agente
        run: bun factory/worker.ts prepare
      - uses: ./.factory-worker/.github/actions/factory-model
        with:
          model: ${{ inputs.model }}
          api-key: ${{ secrets.OPENCODE_API_KEY }}
      - name: Instalar las dependencias autorizadas en aislamiento
        run: bun factory/worker.ts resolve-dependencies
      - name: Comprobar y guardar el cambio propuesto
        id: serialize
        run: bun factory/worker.ts serialize
      - name: Guardar la propuesta o la petición de ayuda
        id: proposal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-proposal-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/agent.patch
            ${{ runner.temp }}/proposal.json
            ${{ runner.temp }}/decision.json
          if-no-files-found: error
          retention-days: 7
  verify:
    name: Probar la aplicación
    needs: generate
    if: needs.generate.outputs.status == 'generated'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      status: ${{ steps.report.outputs.status }}
      feedback_artifact: ${{ steps.evidence.outcome == 'success' && steps.report.outputs.status != '' && format('factory-checks-{0}', github.run_id) || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.base_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-task-${{ github.run_id }}
          path: ${{ runner.temp }}/task
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-proposal-${{ github.run_id }}
          path: ${{ runner.temp }}/proposal
      - name: Validar el cambio antes de ejecutarlo
        id: apply
        env:
          PATCH_SHA: ${{ needs.generate.outputs.patch_sha }}
        run: bun factory/worker.ts apply
      - name: Restaurar la caché de dependencias del candidato
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/factory-bun-cache
          key: factory-bun-1.4.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Probar la aplicación real y su build
        id: checks
        continue-on-error: true
        env:
          FACTORY_DESIGN_ID: ${{ steps.apply.outputs.design_id }}
          FACTORY_EVIDENCE_DIR: ${{ runner.temp }}/evidence
          FACTORY_BUN_CACHE: ${{ runner.temp }}/factory-bun-cache
        run: bash factory/ci/run.sh
      - name: Registrar las pruebas de este cambio
        id: report
        env:
          CHECK_RESULT: ${{ steps.checks.outcome }}
          PATCH_SHA: ${{ needs.generate.outputs.patch_sha }}
        run: bun factory/artifacts.ts report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: evidence
        if: always()
        with:
          name: factory-checks-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7
  review:
    name: Revisión independiente
    needs: [generate, verify]
    if: needs.verify.outputs.status == 'passed'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    outputs:
      status: ${{ steps.review.outputs.status }}
      feedback_artifact: ${{ steps.evidence.outcome == 'success' && steps.review.outputs.status != '' && format('factory-review-{0}', github.run_id) || '' }}
    env:
      WORKER_ROLE: reviewer
      PATCH_SHA: ${{ needs.generate.outputs.patch_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.base_sha }}
          persist-credentials: false
      - name: Cargar la versión registrada del ejecutor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.worker_sha }}
          path: .factory-worker
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-task-${{ github.run_id }}
          path: ${{ runner.temp }}/task
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-proposal-${{ github.run_id }}
          path: ${{ runner.temp }}/proposal
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-checks-${{ github.run_id }}
          path: ${{ runner.temp }}/checks
      - name: Preparar la revisión independiente
        run: bun factory/worker.ts prepare
      - uses: ./.factory-worker/.github/actions/factory-model
        with:
          model: ${{ inputs.reviewer }}
          api-key: ${{ secrets.OPENCODE_API_KEY }}
      - name: Validar el informe del revisor
        id: review
        run: bun factory/worker.ts review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: evidence
        with:
          name: factory-review-${{ github.run_id }}
          path: ${{ runner.temp }}/feedback.json
          if-no-files-found: error
          retention-days: 7
